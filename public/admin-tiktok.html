<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TikTok Admin — UniPath</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Urbanist:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --bg-subtle:#f7f5f2; --text:#111111; --text-muted:#616161;
    --border:#e6e1da; --accent:#fe6a2e;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Inter', ui-sans-serif, system-ui, sans-serif; font-size:16px; line-height:1.6; }
  h1,h2{ font-family:'Urbanist', ui-sans-serif, system-ui, sans-serif; letter-spacing:-0.01em; }
  .wrap{ max-width:560px; margin:0 auto; padding:48px 24px 96px; }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:32px; }
  .brand-mark{ height:34px; width:34px; border-radius:10px; background:var(--text); color:var(--bg); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .brand-name{ font-family:'Urbanist',sans-serif; font-weight:700; font-size:19px; }
  h1{ font-size:26px; font-weight:800; margin:0 0 6px; }
  .subtitle{ color:var(--text-muted); margin:0 0 32px; }
  .card{ background:var(--bg-subtle); border:1px solid var(--border); border-radius:16px; padding:24px; margin-bottom:20px; }
  label{ display:block; font-size:14px; font-weight:600; margin-bottom:6px; }
  input[type="password"], input[type="text"], textarea, input[type="file"]{
    width:100%; border:1px solid var(--border); border-radius:10px; padding:12px 14px;
    font-family:inherit; font-size:15px; background:#fff; color:var(--text);
  }
  textarea{ resize:vertical; min-height:80px; }
  button{
    font-family:inherit; font-weight:700; font-size:15px; border:none; border-radius:10px;
    padding:12px 20px; cursor:pointer; transition:opacity .15s ease;
  }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover:not(:disabled){ opacity:.9; }
  .btn-dark{ background:var(--text); color:#fff; }
  .btn-dark:hover:not(:disabled){ opacity:.85; }
  .row{ margin-bottom:16px; }
  .status{ display:inline-flex; align-items:center; gap:8px; font-size:14px; font-weight:600; }
  .dot{ height:9px; width:9px; border-radius:50%; background:#ccc; }
  .dot.on{ background:#16a34a; }
  .dot.off{ background:#dc2626; }
  #result{ margin-top:16px; font-size:14px; white-space:pre-wrap; word-break:break-word; }
  #result.error{ color:#dc2626; }
  #result.ok{ color:#16a34a; }
  [hidden]{ display:none !important; }
  a{ color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M12 2 2 7l10 5 10-5-10-5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M6 10.5V16c0 1.5 2.7 3.5 6 3.5s6-2 6-3.5v-5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M21 8v6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="brand-name">UniPath</span>
  </div>

  <div id="gate">
    <h1>Admin access</h1>
    <p class="subtitle">Enter the admin key to manage TikTok posting.</p>
    <div class="card">
      <div class="row">
        <label for="adminKeyInput">Admin key</label>
        <input type="password" id="adminKeyInput" placeholder="••••••••" />
      </div>
      <button class="btn-primary" onclick="unlock()">Unlock</button>
      <p id="gateError" class="subtitle" style="color:#dc2626; margin-top:10px;"></p>
    </div>
  </div>

  <div id="panel" hidden>
    <h1>TikTok posting</h1>
    <p class="subtitle">Connect your account, then publish a video directly to TikTok.</p>

    <div class="card">
      <div class="status">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">Checking connection…</span>
      </div>
      <div style="margin-top:14px;">
        <button class="btn-dark" onclick="connectTikTok()">Connect TikTok Account</button>
      </div>
    </div>

    <div class="card">
      <h2 style="font-size:18px; margin:0 0 16px;">Publish a video</h2>
      <div class="row">
        <label for="videoInput">Video file</label>
        <input type="file" id="videoInput" accept="video/*" />
      </div>
      <div class="row">
        <label for="captionInput">Caption</label>
        <textarea id="captionInput" placeholder="Write a caption for this video..."></textarea>
      </div>
      <button class="btn-primary" id="publishBtn" onclick="publishVideo()">Publish to TikTok</button>
      <div id="result"></div>
    </div>
  </div>
</div>

<script>
  const KEY_STORAGE = 'unipath_admin_key';

  function getAdminKey(){ return sessionStorage.getItem(KEY_STORAGE) || ''; }

  function unlock(){
    const key = document.getElementById('adminKeyInput').value.trim();
    if (!key) return;
    sessionStorage.setItem(KEY_STORAGE, key);
    checkGate();
  }

  async function checkGate(){
    const key = getAdminKey();
    if (!key) return;
    try {
      const res = await fetch('/api/tiktok/connection-status', { headers: { 'x-admin-key': key } });
      if (res.status === 401) {
        sessionStorage.removeItem(KEY_STORAGE);
        document.getElementById('gateError').textContent = 'Incorrect admin key.';
        return;
      }
      const data = await res.json();
      document.getElementById('gate').hidden = true;
      document.getElementById('panel').hidden = false;
      setStatus(data.connected);
    } catch (err) {
      document.getElementById('gateError').textContent = 'Could not reach the server. Try again.';
    }
  }

  function setStatus(connected){
    const dot = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    dot.className = 'dot ' + (connected ? 'on' : 'off');
    text.textContent = connected ? 'TikTok account connected' : 'Not connected yet';
  }

  function connectTikTok(){
    window.location.href = '/api/tiktok/login';
  }

  async function publishVideo(){
    const fileInput = document.getElementById('videoInput');
    const caption = document.getElementById('captionInput').value;
    const result = document.getElementById('result');
    const btn = document.getElementById('publishBtn');

    if (!fileInput.files[0]) {
      result.className = 'error';
      result.textContent = 'Select a video file first.';
      return;
    }

    const formData = new FormData();
    formData.append('video', fileInput.files[0]);
    formData.append('caption', caption);

    btn.disabled = true;
    btn.textContent = 'Publishing...';
    result.className = '';
    result.textContent = '';

    try {
      const res = await fetch('/api/tiktok/post', {
        method: 'POST',
        headers: { 'x-admin-key': getAdminKey() },
        body: formData,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Publish failed.');

      result.className = 'ok';
      result.textContent = `Published! publish_id: ${data.publishId}`;
    } catch (err) {
      result.className = 'error';
      result.textContent = err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Publish to TikTok';
    }
  }

  // Auto-unlock if a key from this session is already stored, and pick up a
  // fresh "connected" status right after returning from the OAuth redirect.
  checkGate();
</script>
</body>
</html>
